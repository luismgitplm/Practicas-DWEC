<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Luis Miguel Rodríguez Narváez / 04-13 DWEC</h1>

    <h3>Ejercicio 1</h3>
    <p id="cont1"></p>

    <script>
        const precios = [100, 45, 30, 70, 25];
        const enOferta = precios.filter(precio => precio < 50);
        
        document.getElementById("cont1").innerHTML = 
            "Los productos en oferta: " + enOferta.join(', ');
    </script>

    <h3>Ejercicio 2</h3>
    <p id="cont2"></p>

    <script>
        const comentarios = [
            ["Buen post", "Gracias"],
            ["Interesante"],
            ["No estoy de acuerdo", ["Muy cierto", "Concuerdo"]]
        ];

        const todosComentarios = comentarios.flat(2);
        
        document.getElementById("cont2").innerHTML =
            "Todos los comentarios: " + todosComentarios.join(", ");
    </script>

    <h3>Ejercicio 3</h3>
    <p id="cont3"></p>

    <script>
        const usuarios = [
            { nombre: "Juan", roles: ["admin", "editor"] },
            { nombre: "María", roles: ["usuario"] },
            { nombre: "Pedro", roles: ["moderador", "editor"] }
        ];
        const rolesPlanos = usuarios.flatMap(usuario => usuario.roles);
        
        document.getElementById("cont3").innerHTML = 
            "Todos los roles: " + rolesPlanos.join(", ");
    </script>

    <h3>Ejercicio 4</h3>
    <p id="cont4"></p>

    <script>
        const tareas = ["Lavar platos", "Comprar comida", "Hacer ejercicio"];

        tareas.forEach((tarea, index) => {
            document.getElementById("cont4").innerHTML += 
                `${index + 1}. ${tarea}<br>`;
        });
        
    </script>

    <h3>Ejercicio 5</h3>
    <p id="cont5"></p>

    <script>
        const precios5 = [100, 200, 300];
        const preciosConIVA = precios5.map(precio => precio * 1.21);

        document.getElementById("cont5").innerHTML = 
            "Precios con IVA aplicado: " + preciosConIVA.join(", ");
    </script>

    <h3>Ejercicio 6</h3>
    <p id="cont6"></p>

    <script>
        const usuarios6 = [
            { nombre: "Juan", activo: true },
            { nombre: "María", activo: false },
            { nombre: "Pedro", activo: true }
        ];
        const usuariosActivos = usuarios6.filter(usuario => usuario.activo);
        
        for (x of usuariosActivos){
            document.getElementById("cont6").innerHTML +=
                `Nombre: ${x.nombre}, Activo ${x.activo}<br>`;
        }   
    </script>

    <h3>Ejercicio 7</h3>
    <p id="cont7"></p>

    <script>
        const categorias = ["Electrónica", ["Teléfonos", "Computadoras"], "Ropa"];
        const categoriasPlanas = categorias.flat();
        
        document.getElementById("cont7").innerHTML +=
            "Categorías: " + categoriasPlanas.join(", ");
    </script>

    <h3>Ejercicio 8</h3>
    <p id="cont8"></p>

    <script>
        const nombres = ["juan", "maría", "pedro"];
        const nombresMayus = nombres.map(nombre => nombre.toUpperCase());
        
        document.getElementById("cont8").innerHTML = 
            "Los nombres en mayúsculas: " + nombresMayus.join(", ");
    </script>

    <h3>Ejercicio 9</h3>
    <p id="cont9"></p>

    <script>
        const cantidades = [10, 20, 30, 40];
        cantidades.forEach(cantidad => {
        document.getElementById("cont9").innerHTML +=
            `Se vendieron ${cantidad} productos<br>`;
        });
        
    </script>

    <h3>Ejercicio 10</h3>
    <p id="cont10"></p>

    <script>
        const precios10 = [50, 100, 150];
        const preciosConDescuento = precios10.map(precio => precio * 0.9);
        
        document.getElementById("cont10").innerHTML =
            "Los precios con descuento: " + preciosConDescuento.join(", ");
    </script>
</body>
</html>
