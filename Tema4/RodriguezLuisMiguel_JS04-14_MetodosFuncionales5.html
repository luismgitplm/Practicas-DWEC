<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Luis Miguel Rodríguez Narváez / 04-14 DWEC</h1>
    <h3>Ejercicio 1</h3>
    <p id="cont1"></p>
    
    <script>
        const ventas = [100, 200, 300, 400];
        const totalVentas = ventas.reduce((acumulador, venta) => acumulador + venta, 0);
        
        document.getElementById("cont1").innerHTML = 
            "El total de ventas con reduce: " + totalVentas;
    </script>

    <h3>Ejercicio 2</h3>
    <p id="cont2"></p>

    <script>
        const empleados = ["Juan", "María", "Pedro", "Luis"];
        const nombresInvertidos = empleados.reduceRight((acumulador, nombre) => acumulador + " " + nombre);
        
        document.getElementById("cont2").innerHTML = 
            "Los nombres invertidos con reduceRight: " + nombresInvertidos;
    </script>

    <h3>Ejercicio 3</h3>
    <p id="cont3"></p>

    <script>
        const cantidades = [5, 10, 20, 15];
        const totalProductos = cantidades.reduce((acumulador, cantidad) => acumulador + cantidad, 0);
        
        document.getElementById("cont3").innerHTML = 
            "El total de productos en el inventario: " + totalProductos;
    </script>

    <h3>Ejercicio 4</h3>
    <p id="cont4"></p>

    <script>
        const palabras = ["JavaScript", "es", "increíble"];
        const oracion = palabras.join(" ");
        
        document.getElementById("cont4").innerHTML = 
            "La oracion concatenada con join y espacios: " + oracion;
    </script>

    <h3>Ejercicio 5</h3>
    <p id="cont5"></p>

    <script>
        const numeros = [1, 2, 3, 4, 5];
        const cadenaNumeros = numeros.toString();
        
        document.getElementById("cont5").innerHTML = 
            "Cadena de números con toString: " + cadenaNumeros;
    </script>

    <h3>Ejercicio 6</h3>
    <p id="cont6"></p>

    <script>
        const precios = [1000, 2000, 3000];
        const preciosLocales = precios.toLocaleString("en-US", { style: "currency", currency: "USD" });
        
        document.getElementById("cont6").innerHTML = 
            "Los precios localizados: " + preciosLocales;
    </script>

    <h3>Ejercicio 7</h3>
    <p id="cont7"></p>

    <script>
        const ingresosSemanales = [500, 1000, 1500, 2000];
        const totalIngresos = ingresosSemanales.reduce((total, ingreso) => total + ingreso, 0);
        
        document.getElementById("cont7").innerHTML = 
            "Total de ingrasos en el mes con reduce: " + totalIngresos;
    </script>

    <h3>Ejercicio 8</h3>
    <p id="cont8"></p>

    <script>
        const productos = ["Manzana", "Naranja", "Plátano"];
        const resumen = productos.reduceRight((acumulador, producto) => acumulador + ", " + producto);
        
        document.getElementById("cont8").innerHTML = 
            "Los productos invertidos con reduceRight: " + resumen;
    </script>

    <h3>Ejercicio 9</h3>
    <p id="cont9"></p>

    <script>
        const numeros9 = [10, 20, 30, 40];
        const cadena = numeros.toString();
        
        document.getElementById("cont9").innerHTML = 
            "Números en versión cadena con toString: " + cadena;
    </script>

    <h3>Ejercicio 10</h3>
    <p id="cont10"></p>

    <script>
        const precios10 = [1000, 1500, 2000];
        const preciosEnUSD = precios10.map(precio => precio.toLocaleString("en-US", { style: "currency", currency:
        "USD" }));
        const preciosEnEUR = precios10.map(precio => precio.toLocaleString("de-DE", { style: "currency", currency:
        "EUR" }));
        
        document.getElementById("cont10").innerHTML = 
            "Los precios en USD: " + preciosEnUSD;
        
        document.getElementById("cont10").innerHTML +=
            "<br>Los precios en EUR: " + preciosEnEUR;
    </script>
</body>
</html>
