    <h3>Ejercicio 1: Generar 50 números aleatorios en indicar
        mayor, menor y media
    </h3>
    <script>
        const numeros = new Array();
        let menor = 100;
        let mayor = 0;
        let sumatorio = 0;

        for (let i = 0; i<50; i++){
            numeros[i] = Math.round(Math.random()*100);
            num = numeros[i];
            menor = num<menor ? num:menor;
            mayor = num>mayor ? num:mayor;
            sumatorio += num;
            document.writeln(num);
        }
        let media = sumatorio / 50;

        document.writeln(`El mayor es: ${mayor}, El menor es: ${menor}, 
        La media es: ${media}`);
    </script>

    <h3>Ejercicio 2: Moda y mediana</h3>
    <script>
        numeros.sort();
        for (let i = 1; i <= 50; i++){
            document.writeln(numeros[i]);
        }
        let numAnterior = numeros[0];
        let modaMax = 1;
        let moda = 1;
        let numModa = numeros[0];

        for (let i = 1; i <= 50; i++){
            num = numeros[i];
            if (num == numAnterior){
                moda++;
            } else {
                if (moda>modaMax){
                    modaMax = moda;
                    numModa = numAnterior;
                }
                moda = 1;
            } 
            numAnterior = num;
        }

        document.writeln(`La moda es: ${numModa}`);
    </script>
