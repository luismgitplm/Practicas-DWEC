<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Glosario de métodos de Array en JavaScript</title>
</head>
<body>
  <h1>Glosario de métodos de Array en JavaScript</h1>
  <script>
    // -----------------------------
    // 1. forEach()
    // Recorre el array ejecutando una función por elemento.
    // NO devuelve nada (undefined), NO modifica el array original.
    // -----------------------------
    const nums1 = [1, 2, 3];
    nums1.forEach(n => console.log('forEach:', n * 2));
    // Output esperado: forEach: 2, forEach: 4, forEach: 6

    // -----------------------------
    // 2. map()
    // Crea un nuevo array transformando cada elemento.
    // Devuelve un array nuevo, NO modifica el original.
    // -----------------------------
    const nums2 = [1, 2, 3];
    const doblados = nums2.map(n => n * 2);
    console.log('map:', doblados);
    // Output esperado: map: [2, 4, 6]

    // -----------------------------
    // 3. filter()
    // Crea un nuevo array con elementos que cumplan una condición.
    // Devuelve un array nuevo, NO modifica el original.
    // -----------------------------
    const nums3 = [1, 2, 3, 4];
    const pares = nums3.filter(n => n % 2 === 0);
    console.log('filter:', pares);
    // Output esperado: filter: [2, 4]

    // -----------------------------
    // 4. reduce()
    // Reduce el array a un solo valor (número, objeto, string, etc).
    // Devuelve lo que se decida, NO modifica el original.
    // -----------------------------
    const nums4 = [1, 2, 3];
    const suma = nums4.reduce((acc, n) => acc + n, 0);
    console.log('reduce:', suma);
    // Output esperado: reduce: 6

    // -----------------------------
    // 5. find()
    // Devuelve el primer elemento que cumpla la condición.
    // Devuelve un elemento o undefined, NO modifica el original.
    // -----------------------------
    const users = [{id:1}, {id:2}];
    const user = users.find(x => x.id === 2);
    console.log('find:', user);
    // Output esperado: find: { id: 2 }

    // -----------------------------
    // 6. findIndex()
    // Devuelve el índice del primer elemento que cumpla la condición.
    // Devuelve número o -1, NO modifica el original.
    // -----------------------------
    const nums5 = [5, 10, 15];
    const idx = nums5.findIndex(n => n > 10);
    console.log('findIndex:', idx);
    // Output esperado: findIndex: 2

    // -----------------------------
    // 7. some()
    // Comprueba si al menos un elemento cumple la condición.
    // Devuelve booleano, NO modifica el original.
    // -----------------------------
    const nums6 = [1, 3, 5];
    console.log('some:', nums6.some(n => n % 2 === 0));
    // Output esperado: some: false

    // -----------------------------
    // 8. every()
    // Comprueba si todos los elementos cumplen la condición.
    // Devuelve booleano, NO modifica el original.
    // -----------------------------
    const nums7 = [2, 4, 6];
    console.log('every:', nums7.every(n => n % 2 === 0));
    // Output esperado: every: true

    // -----------------------------
    // 9. includes()
    // Comprueba si el array contiene un valor.
    // Devuelve booleano, NO modifica el original.
    // -----------------------------
    console.log('includes:', [1, 2, 3].includes(2));
    // Output esperado: includes: true

    // -----------------------------
    // 10. indexOf()
    // Devuelve el índice de un valor, o -1 si no existe.
    // NO modifica el original.
    // -----------------------------
    console.log('indexOf:', ['a', 'b', 'c'].indexOf('b'));
    // Output esperado: indexOf: 1

    // -----------------------------
    // 11. at()
    // Devuelve el elemento en una posición, acepta índices negativos.
    // NO modifica el original.
    // -----------------------------
    const arrAt = [10, 20, 30];
    console.log('at:', arrAt.at(-1));
    // Output esperado: at: 30

    // -----------------------------
    // 12. slice()
    // Extrae una parte del array y devuelve un nuevo array.
    // NO modifica el original.
    // -----------------------------
    const nums8 = [1, 2, 3, 4];
    console.log('slice:', nums8.slice(1, 3));
    // Output esperado: slice: [2, 3]

    // -----------------------------
    // 13. splice()
    // Añade, quita o reemplaza elementos.
    // MODIFICA el original. Devuelve los elementos eliminados.
    // -----------------------------
    const arrSplice = [1, 2, 3];
    const removed = arrSplice.splice(1, 1, 'x');
    console.log('splice modified:', arrSplice); // Output esperado: splice modified: [1, "x", 3]
    console.log('splice removed:', removed);    // Output esperado: splice removed: [2]

    // -----------------------------
    // 14. push()
    // Añade elementos al final. MODIFICA el original.
    // Devuelve la nueva longitud.
    // -----------------------------
    const arrPush = [1, 2];
    console.log('push:', arrPush.push(3), arrPush);
    // Output esperado: push: 3 [1, 2, 3]

    // -----------------------------
    // 15. pop()
    // Elimina el último elemento. MODIFICA el original.
    // Devuelve el elemento eliminado.
    // -----------------------------
    const arrPop = [1, 2, 3];
    console.log('pop:', arrPop.pop(), arrPop);
    // Output esperado: pop: 3 [1, 2]

    // -----------------------------
    // 16. unshift()
    // Añade elementos al inicio. MODIFICA el original.
    // Devuelve la nueva longitud.
    // -----------------------------
    const arrUnshift = [2, 3];
    console.log('unshift:', arrUnshift.unshift(1), arrUnshift);
    // Output esperado: unshift: 3 [1, 2, 3]

    // -----------------------------
    // 17. shift()
    // Elimina el primer elemento. MODIFICA el original.
    // Devuelve el elemento eliminado.
    // -----------------------------
    const arrShift = [1, 2, 3];
    console.log('shift:', arrShift.shift(), arrShift);
    // Output esperado: shift: 1 [2, 3]

    // -----------------------------
    // 18. sort()
    // Ordena el array. MODIFICA el original.
    // Devuelve el mismo array ordenado.
    // -----------------------------
    const nums9 = [3, 1, 2];
    nums9.sort((a, b) => a - b);
    console.log('sort:', nums9);
    // Output esperado: sort: [1, 2, 3]

    // -----------------------------
    // 19. reverse()
    // Invierte el array. MODIFICA el original.
    // Devuelve el mismo array invertido.
    // -----------------------------
    const arrReverse = [1, 2, 3];
    arrReverse.reverse();
    console.log('reverse:', arrReverse);
    // Output esperado: reverse: [3, 2, 1]

    // -----------------------------
    // 20. join()
    // Concatena los elementos en un string.
    // Devuelve un string, NO modifica el original.
    // -----------------------------
    console.log('join:', [1, 2, 3].join('-'));
    // Output esperado: join: "1-2-3"

    // -----------------------------
    // 21. flat()
    // Aplana arrays anidados a un nivel dado.
    // Devuelve un nuevo array, NO modifica el original.
    // -----------------------------
    console.log('flat:', [1, [2, [3]]].flat(2));
    // Output esperado: flat: [1, 2, 3]

    // -----------------------------
    // 22. flatMap()
    // Combina map + flat (nivel 1).
    // Devuelve un nuevo array, NO modifica el original.
    // -----------------------------
    const resFlatMap = [1, 2, 3].flatMap(n => [n, n*2]);
    console.log('flatMap:', resFlatMap);
    // Output esperado: flatMap: [1, 2, 2, 4, 3, 6]

    // -----------------------------
    // 23. toSorted() (ES2023)
    // Ordena el array sin modificar el original.
    // Devuelve un nuevo array.
    // -----------------------------
    const arrToSort = [3, 1, 2];
    console.log('toSorted:', arrToSort.toSorted((a,b)=>a-b), arrToSort);
    // Output esperado: toSorted: [1, 2, 3], arrToSort: [3, 1, 2]

    // -----------------------------
    // 24. toReversed() (ES2023)
    // Invierte el array sin modificar el original.
    // Devuelve un nuevo array.
    // -----------------------------
    const arrToRev = [1, 2, 3];
    console.log('toReversed:', arrToRev.toReversed(), arrToRev);
    // Output esperado: toReversed: [3, 2, 1], arrToRev: [1, 2, 3]

    // -----------------------------
    // 25. toSpliced() (ES2023)
    // Como splice, pero sin modificar el original.
    // Devuelve un nuevo array.
    // -----------------------------
    const arrToSpliced = [1, 2, 3];
    console.log('toSpliced:', arrToSpliced.toSpliced(1,1,'x'), arrToSpliced);
    // Output esperado: toSpliced: [1, "x", 3], arrToSpliced: [1,2,3]

    // -----------------------------
    // 26. with() (ES2023)
    // Devuelve una copia cambiando solo un índice.
    // NO modifica el original.
    // -----------------------------
    const arrWith = [1,2,3];
    console.log('with:', arrWith.with(1,99), arrWith);
    // Output esperado: with: [1, 99, 3], arrWith: [1, 2, 3]

    // -----------------------------
    // 27. Array.from()
    // Crea un array desde un objeto iterable o similar a array.
    // Devuelve un nuevo array.
    // -----------------------------
    const set = new Set([1,2,3]);
    const arrFrom = Array.from(set);
    console.log('Array.from:', arrFrom);
    // Output esperado: Array.from: [1, 2, 3]

    // -----------------------------
    // 28. Array.of()
    // Crea un array a partir de los argumentos pasados.
    // Devuelve un nuevo array.
    // -----------------------------
    const arrOf = Array.of(1,2,3);
    console.log('Array.of:', arrOf);
    // Output esperado: Array.of: [1, 2, 3]

    // -----------------------------
    // 29. Array.isArray()
    // Comprueba si un valor es un array.
    // Devuelve booleano.
    // -----------------------------
    console.log('Array.isArray [1,2,3]:', Array.isArray([1,2,3]));
    // Output esperado: Array.isArray [1,2,3]: true
    console.log('Array.isArray {}:', Array.isArray({}));
    // Output esperado: Array.isArray {}: false

  </script>
</body>
</html>
