<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Luis Miguel Rodríguez Narváez / 04-10 DWEC</h1>
    <h3>Ejercicio 1</h3>
      <div id="contenidoEj1"> </div>
    <script>
        let tienda = Array.of(1, 2, 3, 4, 5);
        tienda.fill(7, 2, 5);
        tienda.unshift(0, 0);
        tienda.pop();
        tienda = tienda.concat([10, 20, 30])
        document.getElementById("contenidoEj1").innerHTML = tienda.join(",");
    </script>

    <h3>Ejercicio 2</h3>
    <p id="contenidoEj2"></p>
    <script>
        let empleados = Array.from("abcdef");
        let conten2 = document.getElementById("contenidoEj2");
        conten2.innerHTML = empleados.at(2);
        conten2.innerHTML += empleados.at(empleados.length -1);
        empleados2 = empleados.with(2,"X");
        empleados2.shift();
        empleados2.push("Y","Z");
        conten2.innerHTML += empleados2.join(",");
    </script>
</body>
</html>
