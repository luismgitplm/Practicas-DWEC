<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RGB a HSL</title>
</head>
<body>

<h2>Convertir color RGB a HSL</h2>

<input type="color" id="picker" onchange="convertir()">

<div id="resultado" style="margin-top: 20px; font-size: 18px;"></div>

<script>
function convertir() {

    // 1. Obtener valor del picker -> "#rrggbb"
    const hex = document.getElementById("picker").value;

    // 2. Extraer rr, gg, bb y convertir a decimal
    const r = parseInt(hex.substring(1, 3), 16);
    const g = parseInt(hex.substring(3, 5), 16);
    const b = parseInt(hex.substring(5, 7), 16);

    // 3. Convertir RGB (0-255) → RGB (0-1)
    let R = r / 255;
    let G = g / 255;
    let B = b / 255;

    const max = Math.max(R, G, B);
    const min = Math.min(R, G, B);
    const delta = max - min;

    // 4. Calcular Luminancia
    let L = (max + min) / 2;

    let H, S;

    // 5. Saturación
    if (delta === 0) { // gris
        H = 0;
        S = 0;
    } else {
        S = delta / (1 - Math.abs(2 * L - 1));

        // 6. Matiz (Hue)
        if (max === R) {
            H = 60 * (((G - B) / delta) % 6);
        } else if (max === G) {
            H = 60 * (((B - R) / delta) + 2);
        } else {
            H = 60 * (((R - G) / delta) + 4);
        }
    }

    if (H < 0) H += 360;

    // 7. Formatear resultados
    H = Math.round(H);
    S = Math.round(S * 100); // porcentaje
    L = Math.round(L * 100); // porcentaje

    // 8. Mostrar en el DOM
    document.getElementById("resultado").innerHTML =
        `RGB: (${r}, ${g}, ${b})<br>
         HSL: (${H}°, ${S}%, ${L}%)`;
}
</script>

</body>
</html>
