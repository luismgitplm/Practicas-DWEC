    <h3>Ejercicio 5</h3>
    <script>
        var num = parseInt(prompt("Escribe un número entero"));
        while (Number.isNaN(num)){
            num = parseInt(prompt("No ha escrito un número, inténtelo de nuevo"));
        }

        document.writeln("El código unicode del número indicado es: ",String.fromCharCode(num));
    </script>

    <h3>Ejercicios 6 y 7</h3>
    <script>
        var caracter = prompt("Escriba un caracter");
        var cadena5 = prompt("Escriba una cadena de caracteres");
        document.writeln("La primera aparición del caracter ",caracter, " en la cadena ",cadena5, " es: ",cadena5.indexOf(caracter), "<br>");
        document.writeln("La última aparición del caracter ",caracter, " en la cadena ",cadena5, " es: ",cadena5.lastIndexOf(caracter));
    </script>

    <h3>Ejercicio 8</h3>
    <script>
        cadena = "<br>Los temas son tema 1, tema 3, tema 5 y tema 6";
        //expresion = /(capítulo \d+(\.\d)*)/i;
        expresion = /(tema \d+)/i;
        hallado = cadena.match(expresion);
        document.write( cadena + "<br> expresion en "+hallado[1]);
    </script>
    <p>La variable expresion es una expresión regular que se utiliza para ver si hay partes de la variable cadena que coinciden con ella.</p>
    <p>La variable hallado es un array de cadenas que contiene las coincidencias resultantes de comparar la cadena principal con la expresión.</p>

    <h3>Ejercicio 11</h3>
    <script>
        var cadena8  = prompt("Escribe una cadena de caracteres que será dividida en un array con las distintas palabras:");
        const subcadenas = cadena8.split(" ");

        document.writeln("Aquí las distintas palabras de la cadena: <br>");
        for (var i = 0; i < subcadenas.length; i++){
            document.write(subcadenas[i],"<br>");
        }
    </script>

    <h3>Ejercicio 12</h3>
    <script>
        var cadena9 = prompt("Escribe una cadena a la que se le extraerá un número determinado de caracteres");
        var numPosicion = parseInt(prompt("Indique el número de la posición de inicio por donde se comenzará a extraer: "));
        var numCaracteres = parseInt(prompt("Indique el número de caracteres que se extraerá de la cadena: "));

        document.writeln("Los caracteres extraídos de la cadena son:", cadena9.substr(numPosicion,numCaracteres));
    </script>
