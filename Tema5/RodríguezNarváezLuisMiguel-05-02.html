<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DWEC 05-02</title>

<script type="text/javascript">

function mostrarValores(){
    var salida = document.getElementById("Ejercicio1");

    var v1 = document.getElementById("entradaId").value;
    var v2 = document.formularioBusquedaName.entradaName.value;
    var v3 = document.formularioBusquedaName.elements[0].value;
    var v4 = document.forms["formularioBusquedaName"].elements["entradaName"].value;
    var v5 = document.forms["formularioBusquedaName"].entradaName.value;

    salida.innerHTML = "<h3>Formas de acceder al valor</h3>" +
        "<ul>" +
        "<li>getElementById: " + v1 + "</li>" +
        "<li>form.name: " + v2 + "</li>" +
        "<li>elements[0]: " + v3 + "</li>" +
        "<li>forms['name'].elements['name']: " + v4 + "</li>" +
        "<li>forms['name'].name: " + v5 + "</li>" +
        "</ul>";
}

function convertirMayusculas(){
    var campo = document.getElementById("nombre");
    campo.value = campo.value.toUpperCase();
}

function ponerminusculas(obj){
    obj.value = obj.value.toLowerCase();
}

function ejercicio3(){
    var campo = document.getElementById("nombre");
    var salida = document.getElementById("ej3");

    salida.innerHTML = "<h3>Propiedades del input</h3>" +
        "<ul>" +
        "<li><b>defaultValue:</b> " + campo.defaultValue + "</li>" +
        "<li><b>maxLength:</b> " + campo.maxLength + "</li>" +
        "<li><b>name:</b> " + campo.name + "</li>" +
        "<li><b>readOnly:</b> " + campo.readOnly + "</li>" +
        "<li><b>size:</b> " + campo.size + "</li>" +
        "<li><b>type:</b> " + campo.type + "</li>" +
        "<li><b>value:</b> " + campo.value + "</li>" +
        "</ul>";
}

function ejercicio4(){
    var nombres = ["Carlos","Lucia","Miguel","Elena","Raul"];
    var aleatorio = nombres[Math.floor(Math.random()*nombres.length)];
    document.getElementById("nombre").value = aleatorio;
}

function ejercicio5(){
    var check = document.getElementById("aprobar");
    check.checked = !check.checked;
}

var radioActual = 0;
function ejercicio6(){
    var radios = document.getElementsByName("opcionRadio");
    radios[radioActual].checked = false;
    radioActual = (radioActual + 1) % radios.length;
    radios[radioActual].checked = true;
}

function ejercicio7(){
    var select = document.getElementById("idselect");
    var salida = document.getElementById("ej6");

    var texto = "<h3>Opciones del Select</h3><ul>";
    for(var i=0; i<select.options.length; i++){
        if(select.options[i].selected){
            texto += "<li><b>" + select.options[i].text + "</b></li>";
        }else{
            texto += "<li>" + select.options[i].text + "</li>";
        }
    }
    texto += "</ul>";
    salida.innerHTML = texto;
}


function ejercicio8(){
    var select = document.getElementById("idselect");
    var opcionnueva = document.getElementById("nombre").value;

    var option = document.createElement("option");
    option.text = opcionnueva;
    option.value = opcionnueva;
    select.add(option);
}


function cambiarimagen(obj){
    var imagen = document.getElementsByClassName("image2")[0];
    imagen.src = obj.value;
}


function eliminarSelect(){
    var select = document.getElementById("paises");
    select.remove();
}

</script>
</head>

<body>
<h1>Luis Miguel Rodríguez Narváez 05-02 DWEC</h1>
<h2>Ejercicio 1</h2>
<form id="formularioBusquedaId" action="" name="formularioBusquedaName">
<p>
<input type="text" id="entradaId" name="entradaName">
<input type="button" name="enviar" value="Mostrar Valor" onclick="mostrarValores()">
</p>
</form>
<div id="Ejercicio1"></div>

<hr>
